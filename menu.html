<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fazenda Rush</title>

    <link rel="stylesheet" href="css/style.css" />
    <script src="js/menu.js" defer></script>
  </head> 
  <body>
    <audio src="assets/audio/musica-menu.mp3" autoplay loop>
      <source src="musica.mp3" type="audio/mpeg" />
    </audio>
    <main>
      <!-- Menu inicial -->
      <section id="tela-menu">
        <h1>Fazenda Rush</h1>
        <button id="btn-jogar">Jogar</button>
        <button id="btn-sair">Sair</button>
      </section>
      <!-- Seleção de personagens -->
      <section id="tela-selecao" hidden>
        <h2>Escolha seu personagem</h2>
        <div id="lista-personagens">
          <button class="personagem" data-personagem="Ander">Ander</button>
          <button class="personagem" data-personagem="Joabe">Joabe</button>
          <button class="personagem" data-personagem="Vinicius">
            Vinicius
          </button>
          <button class="personagem" data-personagem="Davi">Davi</button>
          <button class="personagem" data-personagem="Joaquim">Joaquim</button>
        </div>
        <p id="personagem-selecionado">Nenhum personagem selecionado.</p>
        <button id="btn-confirmar" disabled>Confirmar</button>
        <button id="btn-voltar">Voltar</button>
      </section>
      <!-- Tela do jogo -->
      <section id="tela-jogo" hidden>
        <h2>Fazenda Rush</h2>
        <p id="mensagem-inicio"></p>
        <!-- O Canvas será integrado à lógica do jogo -->
        <canvas id="canvas-jogo" width="800" height="450"></canvas>
      </section>
    </main>
  </body>
</html>
