<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Fazenda Rush</title>

    <link rel="stylesheet" href="css/style.css" />
    <link
      rel="shortcut icon"
      href="assets/logo/fazenda-rush-logo.jpeg"
      type="image/x-icon"
    />

    <script src="js/menu.js" defer></script>
    <script src="js/jogador.js" defer></script>
    <script src="js/inimigo.js" defer></script>
    <script src="js/abelha.js" defer></script>
    <script src="js/combate.js" defer></script>
    <script src="js/jogo.js" defer></script>
  </head>

  <body>
    <audio id="musica-menu" src="assets/audio/musica-menu.mp3" loop></audio>
    <button id="btn-musica" aria-label="Mutar música">
      <img src="assets/cenarios/btn-mutar-musica-removebg.png" alt="" />
    </button>
    <main>
      <!-- Tela inicial -->

      <section id="tela-menu">
        <video id="video-fundo" autoplay muted loop playsinline>
          <source src="assets/videos/men-fazenda-rush.mp4" type="video/mp4" />
          Seu navegador não suporta vídeos.
        </video>

        <div class="conteudo-menu">
          <h1 class="titulo-jogo">
            <img
              src="assets/cenarios/logo-fazenda-rush-removebg-preview.png"
              alt="Fazenda rush logo"
            />
          </h1>
          <button id="btn-jogar" type="button" aria-label="Jogar">
            <img
              src="assets/cenarios/Botão de Madeira Pixelado “JOGAR”.png"
              alt=""
            />
          </button>
          <button id="btn-sair" type="button" aria-label="Sair">
            <img src="assets/cenarios/btn-sair-removebg.png" alt="" />
          </button>
        </div>
      </section>

      <!-- Tela de seleção de personagens -->
      <section id="tela-selecao" hidden>
        <div class="titulo-selecao">
          <img
            src="assets/cenarios/esp-menu-selecao.png"
            alt="Escolha seu personagem"
          />
        </div>
        <div id="lista-personagens">
          <button class="personagem" data-personagem="Ander" type="button">
            <canvas
              id="sprite-ander"
              class="sprite-placeholder"
              width="256"
              height="256"
            ></canvas>
            <span>Ander</span>
          </button>

          <button class="personagem" data-personagem="Joabe" type="button">
            <canvas
              id="sprite-joabe"
              class="sprite-placeholder"
              width="256"
              height="256"
            ></canvas>
            <span>Joabe</span>
          </button>

          <button class="personagem" data-personagem="Vinicius" type="button">
            <canvas
              id="sprite-vinicius"
              class="sprite-placeholder"
              width="256"
              height="256"
            ></canvas>
            <span>Vinicius</span>
          </button>

          <button class="personagem" data-personagem="Davi" type="button">
            <canvas
              id="sprite-davi"
              class="sprite-placeholder"
              width="256"
              height="256"
            ></canvas>
            <span>Davi</span>
          </button>

          <button class="personagem" data-personagem="Joaquim" type="button">
            <canvas
              id="sprite-joaquim"
              class="sprite-placeholder"
              width="256"
              height="256"
            ></canvas>
            <span>Joaquim</span>
          </button>
        </div>

        <p id="personagem-selecionado" aria-live="polite">
          Nenhum personagem selecionado.
        </p>

        <button id="btn-confirmar" type="button" disabled>
          <img src="assets/cenarios/btn-confirmar.png" alt="" />
        </button>

        <button id="btn-voltar" type="button">
          <img src="assets/cenarios/btn-voltar.png" alt="" />
        </button>
      </section>

      <!-- Tela do jogo -->
      <section id="tela-jogo" hidden>
        <canvas id="canvas"></canvas>
      </section>
    </main>

    <script src="js/plataforma.js"></script>
    <script src="js/portal.js"></script>
    <script src="js/selecao-personagens.js"></script>
  </body>
</html>
