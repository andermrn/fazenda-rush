# SCRIPT PARA NOTIFICAR NOVOS COMMIT LÁ NO SERVIDOR DO DISCORD!!!

name: Notificar Discord (develop)

on:
  push:
    branches: [develop]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Enviar embed para o Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          COMMITS: ${{ toJson(github.event.commits) }}
          REPO: ${{ github.repository }}
        run: |
          jq -n \
            --argjson commits "$COMMITS" \
            --arg repo "$REPO" '
            def user($c): ($c.author.username // $c.author.name);
            ($commits[:10]) as $list
            | {
                content: "@everyone Novo commit na `develop`!\n⚠️ **Lembrem-se de dar `git pull origin develop`!**",
                embeds: ($list | map({
                  title: (.message | split("\n")[0] | .[:256]),
                  url: .url,
                  color: 5763719,
                  author: (
                    {name: user(.)}
                    + (if .author.username
                       then {icon_url: ("https://github.com/" + .author.username + ".png")}
                       else {} end)
                  ),
                  footer: {text: ($repo + " • develop")},
                  timestamp: .timestamp
                })),
                allowed_mentions: { parse: ["everyone"] }
              }' \
          | curl -sS -H "Content-Type: application/json" -d @- "$WEBHOOK"